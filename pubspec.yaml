name: moodcraft
description: "MoodCraft teaches emotion recognition to primary-school children with ASD, keeping their teachers and parents connected to that learning."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Targets: Android + Web only.
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  intl: ^0.19.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  uuid: ^4.5.1
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  video_player: ^2.9.2
  web: ^1.1.0
  url_launcher: ^6.3.2
  flutter_linkify: ^6.0.0
  linkify: ^5.0.0
  http: ^1.6.0
  flutter_inappwebview: ^6.1.5
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generate localizations (en + ms) from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # Asset directories. Real art is dropped in later without code changes
  # because every path is centralised in lib/core/constants/app_assets.dart.
  assets:
    - assets/ar/
    - assets/images/
    - assets/images/mixmatch/face/
    - assets/images/mixmatch/body/
    - assets/images/mixmatch/situation/
    - assets/images/quiz/look/
    - assets/audio/
    - assets/audio/cues/
    - assets/video/
    - assets/rive/
    - assets/models/

